name: KalkyPreview
options:
  bundleIdPrefix: cz.krokviak.kalky
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    FRAMEWORK_SEARCH_PATHS:
      - $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework
    ONLY_ACTIVE_ARCH: YES
targets:
  KalkyPreview:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.krokviak.kalky.preview
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/shared.framework
        embed: true
        codeSign: false
