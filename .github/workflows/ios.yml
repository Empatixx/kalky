name: iOS CI

on:
  push:
    branches: [main, master]
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'shared/**'
      - 'iosApp/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - '.github/workflows/ios.yml'

jobs:
  ios-build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Kotlin/Native compiler
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile shared module for iOS
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64

      - name: Link iOS framework (debug)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

      - name: Run shared unit tests on iOS Simulator
        # commonTest covers network clients, ViewModels, repos, utils,
        # FoodPhotoAnalyzer pipeline, BMI category — all run against the
        # iosSimulatorArm64 target via Kotlin/Native. Catches KMP regressions
        # that the JVM-only test pass can miss (e.g. Native-incompatible
        # reflection, expect/actual gaps).
        run: ./gradlew :shared:iosSimulatorArm64Test
